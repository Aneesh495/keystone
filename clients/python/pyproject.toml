[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keystone-client"
version = "1.0.0"
description = "Official Python client SDK and synthetic load simulator for Keystone B2B Transaction Mesh"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Keystone Core Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Communications",
    "Topic :: Internet :: Proxy Servers"
]
dependencies = []

[project.scripts]
keystone-simulator = "simulator.load_generator:main"
